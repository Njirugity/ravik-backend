spring.application.name=ravik-backend

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

jwt.expiration=900000
jwt.refresh.expiration=3600000

app.storage.type=local
app.storage.local-root=${STORAGE_LOCAL_ROOT:./uploads}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@ravik.app}

# Forgot-password OTP: length of the code, how long it stays valid, and max wrong attempts.
app.otp.length=6
app.otp.expiry-minutes=10
app.otp.max-attempts=5

# Which profile to load when none is set explicitly (e.g. running from the IDE). Docker/CI set
# this via the SPRING_PROFILES_ACTIVE env var instead of relying on this default.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
