spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ravikdb}
spring.datasource.username=${DB_USERNAME:ravikuser}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# No local fallback on purpose — a test deploy must supply its own secret via env var.
jwt.secret=${JWT_SECRET}

logging.level.org.springframework.web=${WEB_LOG_LEVEL:INFO}

# Seeds a login (admin/Password123!), a project, and reference data on an empty DB. Set to false to disable.
app.seed.dev-data=${SEED_DEV_DATA:true}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
