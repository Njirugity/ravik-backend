# No values are hardcoded here — copy .env.example to .env in the project root and fill in your
# own local values. Defaults below are only a fallback so the app still boots if .env is missing.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ravikdb}
spring.datasource.username=${DB_USERNAME:ravikuser}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}

jwt.secret=${JWT_SECRET:mR+6pPoBja/OWtMjG3qwgUaKsllnemqEI+5ILBo6ZmE=}

logging.level.org.springframework.web=${WEB_LOG_LEVEL:DEBUG}

# Seeds a login (admin/Password123!), a project, and reference data on an empty DB. Set to false to disable.
app.seed.dev-data=${SEED_DEV_DATA:true}

# SMTP settings for outbound emails.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
