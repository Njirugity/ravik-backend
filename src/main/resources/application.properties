spring.application.name=ravik-backend
spring.datasource.url=jdbc:mysql://localhost:3306/ravikdb
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

jwt.secret=mR+6pPoBja/OWtMjG3qwgUaKsllnemqEI+5ILBo6ZmE=
jwt.expiration=900000
jwt.refresh.expiration=3600000

logging.level.org.springframework.web=DEBUG

# Seeds a login (admin/Password123!), a project, and reference data on an empty DB. Set to false to disable.
app.seed.dev-data=true

app.storage.type=local
app.storage.local-root=./uploads

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# SMTP settings for outbound emails.
#TODO: Nitaget hizi creds
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=no-reply@ravik.app

# Forgot-password OTP: length of the code, how long it stays valid, and max wrong attempts.
app.otp.length=6
app.otp.expiry-minutes=10
app.otp.max-attempts=5
